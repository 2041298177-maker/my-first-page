<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- 基础元信息：字符编码 + 移动端视口（没有这一行手机上页面会整体缩小，响应式就无从谈起） -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>你的名字 · 个人介绍</title>

  <style>
    /* ===== 1. 主题变量 =====
       把所有颜色集中在这里，以后想换配色只改这几行即可 */
    :root {
      --bg: #0f1115;            /* 页面深色背景 */
      --bg-soft: #181b22;       /* 卡片背景，比页面略亮一点形成层次 */
      --text: #e6e8eb;          /* 主文字颜色（不用纯白，眼睛更舒服） */
      --muted: #9aa4b2;         /* 次要文字颜色（介绍、占位说明） */
      --accent: #6c9cff;        /* 强调色：装饰线、卡片标题、链接 */
      --border: #262d38;        /* 卡片描边，增加精致感 */
      --radius: 16px;           /* 圆角统一值 */
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.35); /* 轻微阴影 */
    }

    /* ===== 2. 全局重置 =====
       清掉浏览器默认边距，并让宽高计算包含内边距，布局更可控 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ===== 3. 页面整体 =====
       字体用系统默认字体族，不加载任何外部字体 */
    body {
      min-height: 100vh;
      display: flex;                /* 配合 justify-content 让内容在垂直方向居中 */
      flex-direction: column;
      justify-content: center;
      background-color: var(--bg);
      /* 顶部加一层极淡的光晕渐变，让深色背景不至于死黑一片 */
      background-image: radial-gradient(
        1200px 500px at 50% -10%,
        rgba(108, 156, 255, 0.12),
        transparent 60%
      );
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto,
                   "PingFang SC", "Microsoft YaHei", sans-serif;
      line-height: 1.7;
      padding: 48px 20px;           /* 上下留呼吸空间，左右保证文字不贴边 */
    }

    /* ===== 4. 内容容器 =====
       限制最大宽度，避免大屏幕上文字一行拉太长影响阅读 */
    .container {
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
    }

    /* ===== 5. 顶部：姓名 + 一句话介绍 ===== */
    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header .name {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* 名字下方一条短装饰线，纯 CSS 实现，不用图片 */
    .header .divider {
      width: 56px;
      height: 3px;
      background: var(--accent);
      border-radius: 999px;
      margin: 14px auto 18px;
      opacity: 0.85;
    }

    .header .tagline {
      color: var(--muted);
      font-size: 1.05rem;
    }

    /* ===== 6. 中部：三张卡片 =====
       auto-fit + minmax 是关键：容器够宽就三列，变窄自动折成两列/一列 */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .card {
      background-color: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: var(--radius);      /* 卡片圆角 */
      box-shadow: var(--shadow);         /* 轻微阴影 */
      padding: 24px;
      /* 悬停时轻微上浮 + 高亮描边，增加一点交互反馈 */
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    /* 卡片小标题用强调色，左侧小圆点代替图标，避免引入外部图标库 */
    .card h2 {
      font-size: 1.1rem;
      color: var(--accent);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card h2::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;                    /* 防止小圆点被压缩变形 */
    }

    .card p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* 占位文字样式：替换成真实内容后，可以直接删掉这个类和对应的 class 属性 */
    .placeholder {
      font-style: italic;
      opacity: 0.75;
    }

    /* ===== 7. 底部：GitHub 链接 ===== */
    .footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
      padding-bottom: 2px;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s ease;
    }

    /* 悬停时才出现下划线，比默认常驻下划线更克制 */
    .footer a:hover {
      border-bottom-color: var(--accent);
    }

    /* ===== 8. 手机端微调 =====
       卡片折行已由 grid 自动处理，这里只把字号和留白收紧 */
    @media (max-width: 600px) {
      body { padding: 32px 16px; }
      .header .name { font-size: 1.9rem; }
      .header .tagline { font-size: 0.98rem; }
      .header { margin-bottom: 28px; }
      .cards { gap: 16px; margin-bottom: 28px; }
      .card { padding: 20px; }
    }
  </style>
</head>

<body>
  <!-- 外层容器：约束内容宽度并水平居中 -->
  <div class="container">

    <!-- 顶部区域：名字 + 一句话介绍（占位，替换成你自己的信息） -->
    <header class="header">
      <h1 class="name">ggbond</h1>
      <div class="divider"></div>
      <p class="tagline">2027届计算机专业，正在学用AI做产品，找第一份实习</p>
    </header>

    <!-- 中部区域：三张卡片 -->
    <main class="cards">

      <!-- 卡片 1：我在学什么 -->
      <section class="card">
        <h2>我在学什么</h2>
        <p class="placeholder">HTML/CSS/JavaScript基础，正在学怎么用 AI 工具写代码、
以及怎么判断它写得对不对。目标是能独立做出上线可用的小工具。</p>
      </section>

      <!-- 卡片 2：我在做什么 -->
      <section class="card">
        <h2>我在做什么</h2>
        <p class="placeholder">第一个项目：求职投递追踪看板，记录每份投递的公司、岗位和状态。
下一步做第二个项目：调用大模型API的简历优化工具。</p>
      </section>

      <!-- 卡片 3：我想找什么样的工作 -->
      <section class="card">
        <h2>我想找什么样的工作</h2>
        <p class="placeholder">AI 应用开发、实施工程师、技术支持方向的实习。
能跑现场、能扛交付，不怕上手陌生系统。</p>
      </section>

    </main>

    <!-- 底部区域：GitHub 链接（href 用 # 占位，之后换成真实地址） -->
    <footer class="footer">
       <p>我的作品：</p>
       <p>
        <a href="https://2041298177-maker.github.io/job-tracker/" target="_blank">
      求职投递追踪工具
        </a>
        .
    <a href="https://github.com/2041298177-maker" target="_blank">GitHub</a>
  </p>
</footer>

  </div>
</body>
</html>
